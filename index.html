      // then returns here with a saved path. Restore it before React mounts.
      (function () {
        try {

          var ghPath = params.get('gh-path');
          if (!ghPath) return;
          var base = '%BASE_URL%';
          var cleanBase = base.replace(/\/$/, '');
          var target = cleanBase + ghPath;
          history.replaceState(null, '', target);
        } catch (e) {}
      })();
      // One-time cleanup: remove legacy app-shell Service Workers/caches that
      // can keep serving stale GitHub Pages bundles to returning visitors.
      (function () {
        try {
          var KEY = 'ex-sw-cleanup-v5';
          if (localStorage.getItem(KEY)) return;
          var didWork = false;
          var base = '%BASE_URL%';
          var cleanBase = base === '/' ? '/' : base.replace(/\/$/, '/');
          var appScope = location.origin + cleanBase;
          var appSwPattern = /\/(sw|service-worker)\.js(?:$|[?#])/;
          function isLikelyAppCacheName(name) {
            return /(^|-)precache-v\d+-|(^|-)runtime-|(^|-)googleAnalytics-/.test(name) || /^workbox-/.test(name) || name.indexOf(cleanBase) !== -1 || name.indexOf('ervitex') !== -1;
          }
          function cacheContainsAppFiles(name) {
            if (!window.caches || !caches.open) return Promise.resolve(false);
            return caches.open(name).then(function (cache) {
              return cache.keys().then(function (requests) {
                return requests.some(function (request) {
                  return request.url.indexOf(appScope) === 0;
                });
              });
            }).catch(function () { return false; });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (r) {

                if (appSwPattern.test(url) || r.scope.indexOf(appScope) === 0) { didWork = true; return r.unregister(); }
                return Promise.resolve(false);
              }));
            }).then(function () {
              if (navigator.serviceWorker.controller) {
                didWork = true;
                navigator.serviceWorker.addEventListener('controllerchange', function () { location.reload(); }, { once: true });
              }

              }

                  return Promise.all(keys.map(function (key) {
                    if (isLikelyAppCacheName(key)) { didWork = true; return caches.delete(key); }
                    return cacheContainsAppFiles(key).then(function (containsAppFiles) {
                      if (containsAppFiles) { didWork = true; return caches.delete(key); }
                      return false;
                    });
                  }));
                });
              }
            }).then(function () {
              localStorage.setItem(KEY, '1');
              if (didWork) location.reload();
            }).catch(function () { localStorage.setItem(KEY, '1'); });
          } else if (window.caches && caches.keys) {
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) {
                if (isLikelyAppCacheName(key)) { didWork = true; return caches.delete(key); }
                return cacheContainsAppFiles(key).then(function (containsAppFiles) {
                  if (containsAppFiles) { didWork = true; return caches.delete(key); }
                  return false;
                });

      // Cross-browser build-version check. Firefox/Safari cache HTML aggressively

      // version.json with no-store and force a hard reload if it changed.
      (function () {
        try {
          var base = '%BASE_URL%';
          var url = base + 'version.json?_=' + Date.now();
          var STORAGE_KEY = 'ex-build-version';
          var RELOAD_GUARD = 'ex-build-version-reloaded';
          fetch(url, { cache: 'no-store', credentials: 'omit' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) {
              if (!data || !data.version) return;
              var current = localStorage.getItem(STORAGE_KEY);
              if (current === data.version) {
                sessionStorage.removeItem(RELOAD_GUARD);
                return;
              }
              localStorage.setItem(STORAGE_KEY, data.version);
              if (!current) return; // first visit, nothing to reload
              if (sessionStorage.getItem(RELOAD_GUARD)) return; // avoid loops
              sessionStorage.setItem(RELOAD_GUARD, '1');
              location.reload();
            })
            .catch(function () {});
        } catch (e) {}
      })();
      // Stale-bundle recovery: installed PWAs / mobile browsers can hold an old
      // index.html whose hashed chunks no longer exist, leaving a blank screen.
      // On a chunk load failure, bust caches once and reload.
      (function () {

                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              }).finally(function () { location.reload(); });
              return;
            }
          } catch (e) {}
          location.reload();
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) recover();
