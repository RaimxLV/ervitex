name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify dist output
        run: test -f dist/index.html

      - name: Write build version
        run: |
          echo "{\"version\":\"${GITHUB_SHA}\",\"builtAt\":\"$(date -u +%FT%TZ)\"}" > dist/version.json

      - name: SPA fallback
        run: |
          repo="/${GITHUB_REPOSITORY#*/}"
          cat > dist/404.html <<'EOF'
          <!doctype html>
          <html lang="lv">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Ervitex</title>
              <script>
                (function () {
                  var repo = '__REPO_BASE__';
                  var path = window.location.pathname;
                  var relative = path.indexOf(repo + '/') === 0 ? path.slice(repo.length) : '/';
                  var target = repo + '/?gh-path=' + encodeURIComponent(relative + window.location.search + window.location.hash);
                  window.location.replace(target);
                })();
              </script>
            </head>
            <body></body>
          </html>
          EOF
          sed -i "s|__REPO_BASE__|$repo|g" dist/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
